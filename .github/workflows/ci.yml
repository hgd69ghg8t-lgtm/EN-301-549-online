# Build, validate and accessibility-test the site on every push and PR.
#
# CI runs the same named npm scripts a maintainer runs locally — see
# package.json. `npm test` (= test:ci) is the complete supported suite:
#   test:static  — Python unit tests, the theme contrast checker, the
#                  build itself (the primary content validator: missing/
#                  invalid content, duplicate ids, wrong H1 counts,
#                  broken internal links, heading-hierarchy/id problems,
#                  site configuration, deployment files, the 404 page),
#                  and html-validate (HTML5/ARIA spec conformance).
#   test:browser — the Playwright Chromium suites: axe-core in both
#                  automatic themes plus explicit theme overrides (incl.
#                  the 404 page), responsive layout, site search, theme
#                  behaviour (persistence, pre-paint, theme-color sync,
#                  print palette, forced colours), the custom 404 page,
#                  and deterministic performance budgets (resource counts
#                  and sizes — never wall-clock — see
#                  docs-for-maintainers/performance.md). Every suite also
#                  fails on unexpected runtime errors or failed
#                  same-origin requests.
# Between the two, CI verifies the committed docs/ matches a clean
# rebuild. Because the build now replaces docs/ atomically (nothing from
# the previous output survives), `git status --porcelain` catches every
# kind of drift: modified pages, stale files that should have been
# deleted, missing copied assets or deployment files, changed PDF bytes,
# and changed generated 404 output — including files a plain `git diff`
# would miss because they are untracked.
# External (http/https/mailto/tel) links are NOT checked here at all;
# verifying those would need a scheduled external-link checker, which
# this workflow does not include.
name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

# A newer commit on the same branch/PR supersedes the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Generous for the Playwright suites; a hung browser test must
    # not run indefinitely.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Kept in step with .python-version so local and hosted builds
          # use the same interpreter line.
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Static checks and build (npm run test:static)
        run: npm run test:static

      - name: Committed docs/ matches a clean rebuild
        run: |
          if [ -n "$(git status --porcelain -- docs/)" ]; then
            git status --porcelain -- docs/;
            echo "::error::docs/ is out of date with its sources (content/, assets/, source/, deployment/, data/, scripts/sitemap.json) — rebuild with 'npm run build' and commit the difference, including deleted stale files.";
            exit 1;
          fi

      - name: Browser suites (npm run test:browser)
        run: npm run test:browser
