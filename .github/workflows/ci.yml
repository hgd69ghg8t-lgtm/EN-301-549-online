# Build, validate and accessibility-test the site on every push and PR.
#
# What runs, in order: Python unit tests (the build's own validators),
# the light/dark theme contrast checker (palettes parsed from the CSS),
# the build (itself the primary content validator: missing/extra
# fragments, wrong H1 counts, id mismatches, duplicate ids, skipped
# heading levels, malformed HTML, broken internal links), a
# generated-output reproducibility diff, html-validate (HTML5/ARIA spec
# conformance), and the Playwright browser suites: axe-core in both
# automatic themes plus explicit theme overrides, responsive layout,
# site search, theme behaviour (persistence, pre-paint, theme-color
# sync, print palette, forced colours), optional-module failure paths,
# and the performance budgets (all measured against the local generated
# site — never the public internet, so no network-weather flakes).
# Every browser suite also fails on any unexpected page error, console
# error, unhandled rejection or failed same-origin request — see
# scripts/test-helpers.mjs.
# Deliberately not adding a separate link-checker (lychee/linkinator):
# the custom Python build already validates every internal link and
# anchor.
name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Unit tests for the build's own validators
        run: python3 -m unittest scripts/test_build.py

      - name: Verify light and dark theme contrast (palettes parsed from the CSS)
        run: python3 scripts/check-contrast.py

      - name: Build the site (fails on missing/invalid content, duplicate IDs, wrong H1 count, broken links, heading-hierarchy/id problems)
        run: npm run build

      - name: Fail if committed docs/ doesn't match a clean rebuild
        run: |
          git diff --exit-code -- docs/ || {
            echo "::error::docs/ is out of date with content/, scripts/sitemap.json or data/source-metadata.json — rebuild and commit the difference.";
            exit 1;
          }

      - name: Validate generated HTML (html-validate)
        run: npx html-validate "docs/*.html"

      - name: Accessibility sweep (axe-core, WCAG 2.0/2.1/2.2 AA)
        run: npm run test:a11y

      - name: Responsive layout assertions (no page overflow, no avoidable table scrollbars, content grows with viewport)
        run: npm run test:layout

      - name: Site search end-to-end checks
        run: npm run test:search

      - name: Theme behaviour checks (persistence, pre-paint, theme-color sync, print palette, forced colours)
        run: npm run test:theme

      - name: Optional-module failure checks (every lazy bundle and search resource deliberately broken in turn)
        run: npm run test:modules

      - name: Performance budgets (local generated site, throttled mobile profile — see data/performance-budgets.json)
        run: npm run test:performance
